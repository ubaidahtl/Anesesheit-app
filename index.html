<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#185c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>مدرستي | سجل الحضور</title></head><body><header><div><small>إدارة الحضور المدرسي</small><h1>مدرستي</h1></div><span id="dbState" class="pill">جارٍ فتح السجل…</span></header><nav><button data-view="new" class="active">نشاط جديد</button><button data-view="saved">الأنشطة المحفوظة</button><button data-view="people">الأشخاص</button></nav><main>
<section id="view-new"><h2>إنشاء نشاط وتسجيل الحضور</h2><form id="activityForm"><label>اسم النشاط<input id="activityTitle" required maxlength="120" placeholder="مثال: النشاط الصباحي"></label><div class="fields"><label>التاريخ<input id="activityDate" type="date" required></label><label>المجموعة / النوع<input id="activityType" maxlength="80" placeholder="اختياري"></label></div><label>ملاحظات<textarea id="activityNotes" rows="2" placeholder="اختياري"></textarea></label><div class="section-head"><h3>الحضور</h3><button type="button" id="selectAll" class="subtle">تحديد الجميع</button></div><p class="hint">اختر الأشخاص المشاركين، ثم حدد حالة كل شخص. سيتم حفظ النشاط وحضوره معًا.</p><div id="roster" class="roster empty">أضف أشخاصًا أولًا من تبويب «الأشخاص».</div><button class="primary full" type="submit" id="saveActivity">حفظ النشاط والحضور</button><p id="formMsg" role="status" class="message"></p></form></section>
<section id="view-saved" hidden><div class="section-head"><h2>الأنشطة المحفوظة</h2><button id="refreshSaved" class="subtle">تحديث</button></div><div id="savedList" class="stack"></div></section>
<section id="view-people" hidden><h2>إدارة الأشخاص</h2><form id="personForm" class="inline-form"><label>اسم الشخص<input id="personName" required maxlength="120" placeholder="الاسم الكامل"></label><button class="primary" type="submit">إضافة</button></form><p id="peopleMsg" role="status" class="message"></p><div id="peopleList" class="stack"></div></section>
</main><footer>يحفظ هذا الإصدار البيانات على هذا الجهاز فقط.</footer><dialog id="confirmDialog"><p id="confirmText">هل تريد المتابعة؟</p><div class="actions"><button id="cancelConfirm" class="subtle">إلغاء</button><button id="acceptConfirm" class="danger">حذف</button></div></dialog><script src="app.js"></script></body></html>
